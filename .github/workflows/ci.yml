name: CI

# Fast feedback on every push and pull request. This never builds an installer
# and never publishes anything — nightly.yml owns the daily bundles, release.yml
# owns tagged releases. Both platforms are checked because the interesting code
# is behind #[cfg(windows)]: a Linux-only check would compile none of it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'lanche-furry/IRIXEN-Code'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Same libraries the Linux bundle needs; `cargo check` still requires the
      # pkg-config metadata that Tauri's build script probes for.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Every Markdown file ships in both languages: a mirrored pair, the inline
      # bilingual layout used by release notes, or a runtime prompt that is not
      # documentation at all. Catches "wrote the doc, forgot the translation".
      - name: Check the docs are bilingual
        run: npm run docs:check

      # `tsc --noEmit` + Vite bundle. The type check is the part that matters
      # here; building the bundle keeps the entry point honest too.
      - name: Type check and bundle the frontend
        run: npm run build

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
