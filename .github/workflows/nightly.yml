name: Nightly build

# One installer a day per platform, built from the head of `main` and published
# as the rolling `nightly` pre-release. Nightlies are build artifacts, not
# versions: the in-app updater only considers versioned tags (see
# src-tauri/src/update.rs), so a nightly never pops an "update available" prompt.
#
# CI deliberately does NOT go through scripts/build.mjs. That wrapper expects the
# portable toolchain in .tools/ (git-ignored) and pins windows-gnu with rust-lld.
# Runners already provide a native toolchain (MSVC on Windows, GNU on Linux),
# which is what Tauri targets by default.

on:
  schedule:
    # Six crons a day, and `guard` below throws away all but the first one to
    # actually reach a runner. That is not belt-and-braces for its own sake:
    # GitHub's schedule queue is best-effort, and this repository's runs have
    # been arriving **two to eight hours late** — the single `7 12 * * *` cron
    # produced runs at 20:24Z, 20:27Z, 20:47Z and 21:55Z, and on 2026-11-20 the
    # dispatch never showed up at all. One dispatch a day therefore means some
    # days have no nightly. Six do not: whatever the queue does, one of them
    # lands, and the guard keeps it to a single build per UTC day.
    #
    # Seven minutes past the hour on purpose: the top of the hour is the queue's
    # busiest minute. Still not a timer — only the copy of this file on the
    # default branch is read for cron.
    - cron: "7 0 * * *"
    - cron: "7 4 * * *"
    - cron: "7 8 * * *"
    - cron: "7 12 * * *"
    - cron: "7 16 * * *"
    - cron: "7 20 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Decides whether this dispatch is the one that builds today.
  #
  # The crons above are cheap only because this job is cheap: it reads the
  # rolling release's title and exits in seconds. Scheduler delays mean several
  # of them can land on the same UTC day, and a second build would just delete
  # and recreate the release the first one published — ten minutes of Windows
  # for nothing, plus a confusing "Nightly" page that churns.
  #
  # A failed build does not count as published, so the next dispatch retries it
  # instead of the day silently having nothing. A manual dispatch always builds:
  # asking for a run means you want to see it run.
  guard:
    if: github.repository == 'lanche-furry/IRIXEN-Code'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Is today's nightly already published?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "manual dispatch — building"
            exit 0
          fi
          today="Nightly $(date -u +%Y%m%d)"
          have=$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json name -q .name 2>/dev/null || true)
          if [ "$have" = "$today" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$have is already out — this dispatch is redundant"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "publishing $today (release currently: ${have:-none})"
          fi

  windows:
    needs: guard
    # Schedules fire on the default branch of the origin repo only; this also
    # keeps forks from publishing releases into their own repo by accident.
    if: github.repository == 'lanche-furry/IRIXEN-Code' && needs.guard.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # `tauri build` runs beforeBuildCommand (`npm run build`), which is the
      # type check plus the Vite bundle, then links the release exe and packs
      # the NSIS installer from src-tauri/tauri.conf.json.
      - name: Build the NSIS installer
        run: npm run tauri build

      - name: Collect the installer
        shell: bash
        run: |
          set -euo pipefail
          date=$(date -u +%Y%m%d)
          echo "DATE=$date" >> "$GITHUB_ENV"
          mkdir -p out
          found=0
          for src in src-tauri/target/release/bundle/nsis/*setup.exe; do
            [ -f "$src" ] || continue
            cp "$src" "out/IRIXEN.Code_nightly-${date}_x64-setup.exe"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "no installer produced"; exit 1; }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: irixen-nightly-windows
          path: out/*
          retention-days: 14

  linux:
    needs: guard
    if: github.repository == 'lanche-furry/IRIXEN-Code' && needs.guard.outputs.build == 'true'
    # 22.04 is the compromise: its glibc (2.35) still runs on most current
    # distributions, and it packages webkit2gtk-4.1 that Tauri v2 links against.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Pure unit tests: release tag handling, NLS fallback, CSP URL rewriting.
      # None of them touch the network or a display, so they run before the
      # expensive release build and fail the job early.
      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # tauri.conf.json pins `bundle.targets` to nsis (the Windows product), so
      # the Linux bundles have to be requested explicitly.
      - name: Build deb and AppImage
        run: npx tauri build --bundles deb,appimage

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          date=$(date -u +%Y%m%d)
          mkdir -p out
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          test -n "$appimage" && cp "$appimage" "out/IRIXEN_Code_nightly-${date}_amd64.AppImage"
          test -n "$deb" && cp "$deb" "out/IRIXEN_Code_nightly-${date}_amd64.deb"
          ls -l out

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: irixen-nightly-linux
          path: out/*
          retention-days: 14

  publish:
    needs: [guard, windows, linux]
    if: needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Same layout as the tagged releases (Beta 0.1): one document, both
      # languages on every line — prose as a Chinese paragraph followed by its
      # English counterpart, headings and bullets as `中文 / English`.
      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          date=$(date -u +%Y%m%d)
          echo "DATE=$date" >> "$GITHUB_ENV"
          version=$(node -p "require('./package.json').version")
          sha=$(git rev-parse --short HEAD)
          built=$(date -u '+%Y-%m-%d %H:%M UTC')
          {
            echo "# IRIXEN Code Nightly ${date}"
            echo
            echo "自动每日构建，来自 \`main\` 的最新提交；每日构建可能不稳定，正式版本请看 Beta 发布。"
            echo
            echo "Automated nightly build from the latest commit on \`main\`. Nightlies can be unstable — for releases, see the Beta channel."
            echo
            echo "## 构建信息 / Build"
            echo
            echo "- 提交：\`${sha}\` / Commit: \`${sha}\`"
            echo "- 构建时间：${built} / Built at: ${built}"
            echo "- 版本基线：${version} / Version baseline: ${version}"
            echo
            echo "## 安装 / Install"
            echo
            echo "- **Windows x64**：\`IRIXEN.Code_nightly-${date}_x64-setup.exe\`，双击安装（per-user，不用管理员）/ \`IRIXEN.Code_nightly-${date}_x64-setup.exe\` — run it, installs per user without admin rights"
            echo "- **Linux x64**：\`IRIXEN_Code_nightly-${date}_amd64.AppImage\` 或 \`.deb\` / \`IRIXEN_Code_nightly-${date}_amd64.AppImage\` or \`.deb\`"
            echo
            echo "## 最近提交 / Recent commits"
            echo
            echo '```'
            git log --oneline -10
            echo '```'
          } > nightly-notes.md
          ls -l dist

      # Same reason as release.yml: the updater hashes what it downloads, so a
      # nightly carries the file it looks for too.
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recreate instead of patching: nightlies are disposable, and a fresh
          # release keeps exactly one asset per platform per day.
          #
          # Three attempts, because the first one here was answered with a bare
          # `HTTP 403: Resource not accessible by integration` on the create call
          # — with `contents: write` granted, the delete a line earlier having
          # just succeeded, and the same commit publishing fine ten minutes later
          # on a re-run. A transient 403 should cost twenty seconds, not a gap in
          # the nightly channel until the next cron.
          publish() {
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly dist/* \
              --title "Nightly ${DATE}" \
              --notes-file nightly-notes.md \
              --prerelease \
              --target "$GITHUB_SHA"
          }
          for attempt in 1 2 3; do
            if publish; then
              echo "published on attempt ${attempt}"
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::publishing failed on all three attempts"
              exit 1
            fi
            echo "attempt ${attempt} failed — retrying in 20s" >&2
            sleep 20
          done
