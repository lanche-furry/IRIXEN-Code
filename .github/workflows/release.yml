name: Release

# A tag is the release switch. Pushing `Beta0.2` builds both platforms and
# publishes them as the **latest** release — non-prerelease, so `/releases/latest`
# returns it and every older build sees an update.
#
# nightlies stay on the rolling `nightly` tag and never reach the latest channel.
on:
  push:
    tags:
      - "Beta*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist, e.g. Beta0.2)"
        required: true

# Keyed on the tag, not on the ref that triggered the run: a tag push and a
# workflow_dispatch for the same tag must not publish at the same time.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'lanche-furry/IRIXEN-Code'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always
      # Empty when the secrets are absent; the signing step skips in that case.
      SIGN_PFX: ${{ secrets.WINDOWS_SIGN_PFX }}
      SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # `tauri build` runs beforeBuildCommand (`npm run build`) itself, so the
      # type check is covered here too.
      #
      # MSI, not NSIS: generic antivirus heuristics have fired on three NSIS
      # builds in a row, and WiX only runs on Windows — which is why this job
      # builds the installer and the Linux job cannot.
      - name: Build MSI installers
        run: npm run tauri build

      # Signing happens after packaging: the certificate is a release concern
      # and a local `npm run app:build` must keep working without one. The exe
      # inside the installer stays unsigned — sign it before bundling with
      # bundle.windows.signCommand if that ever matters.
      - name: Sign the exe and the installers
        if: env.SIGN_PFX != ''
        shell: pwsh
        run: |
          ./scripts/sign-windows.ps1 `
            src-tauri/target/release/irixen-code.exe `
            src-tauri/target/release/bundle/msi/*.msi

      - name: Note unsigned build
        if: env.SIGN_PFX == ''
        shell: bash
        run: echo "::warning::WINDOWS_SIGN_PFX is not set — publishing an unsigned installer"

      # One MSI per WiX language (en-US, zh-CN). The culture goes into the asset
      # name because the updater picks the wizard matching the app's own UI
      # language, and because two files named after the product would collide.
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          found=0
          for src in src-tauri/target/release/bundle/msi/*.msi; do
            [ -f "$src" ] || continue
            base=$(basename "$src")
            case "$base" in
              *_en-US.msi) culture=en-US ;;
              *_zh-CN.msi) culture=zh-CN ;;
              *) culture=${base%.msi} ;;
            esac
            cp "$src" "out/IRIXEN.Code_${version}_x64_${culture}.msi"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "no installer produced"; exit 1; }
          ls -l out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*

  linux:
    if: github.repository == 'lanche-furry/IRIXEN-Code'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Cheap insurance: the tag must point at code that already passes.
      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # tauri.conf.json pins `bundle.targets` to nsis, so ask for the Linux
      # formats explicitly.
      - name: Build deb and AppImage
        run: npx tauri build --bundles deb,appimage

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          mkdir -p out
          test -n "$appimage" && cp "$appimage" "out/IRIXEN_Code_${version}_amd64.AppImage"
          test -n "$deb" && cp "$deb" "out/IRIXEN_Code_${version}_amd64.deb"
          test -n "$appimage" -a -n "$deb" || { echo "missing Linux bundle"; exit 1; }
          ls -l out

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: out/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A tag cut without running `npm run bump` produces an installer whose
      # version contradicts its own release. Tags are product labels (`Beta0.2`),
      # so compare the numeric parts: one must be a prefix of the other.
      - name: Verify tag matches package version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          stripped=$(echo "$TAG" | sed 's/^[vV]//')
          core=$(node -p "require('./package.json').version.split('-')[0]")
          digits=$(echo "$stripped" | grep -oE '[0-9]+' | paste -sd. -)
          case "$core" in
            "$digits"|"$digits".*) echo "tag $TAG -> version $core";;
            *)
              case "$digits" in
                "$core"|"$core".*) echo "tag $TAG -> version $core";;
                *) echo "::error::tag $TAG does not match package version $core — run npm run bump first"; exit 1;;
              esac;;
          esac

      # Release notes are a deliverable, not an afterthought: the Beta 0.1
      # layout (`中文 / English` on every heading and bullet) or the release
      # fails here, before anything is uploaded. See docs/release-notes/Beta0.2.md.
      - name: Check the release notes are bilingual
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/notes-check.mjs "$TAG" --allow-missing

      # The app's updater will not run an installer it cannot hash, so the
      # checksum file it looks for is generated here from the exact bytes that
      # are about to be uploaded. `sha256sum` writes "<hash>  <name>", which is
      # the format src-tauri/src/update.rs parses.
      - name: Write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # Re-running for a tag that already has a release replaces the assets
      # instead of failing: signing is added after the fact, and a rebuild is
      # the only way to get signed binaries onto an existing release.
      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # The human-facing label, kept in sync by `npm run bump --label`.
          title=$(sed -n 's/.*pub const DISPLAY_VERSION: &str = "\([^"]*\)".*/\1/p' src-tauri/src/update.rs)
          test -n "$title" || title="$TAG"
          if [ -f "docs/release-notes/${TAG}.md" ]; then
            notes=(--notes-file "docs/release-notes/${TAG}.md")
          else
            notes=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing assets"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --latest "${notes[@]}"
          else
            gh release create "$TAG" dist/* \
              --title "$title" \
              --latest \
              "${notes[@]}"
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag: .tagName, pre: .isPrerelease, assets: [.assets[].name]}'
