name: Release

# A tag is the release switch. Pushing `Beta0.2` builds both platforms and
# publishes them as the **latest** release — non-prerelease, so `/releases/latest`
# returns it and every older build sees an update.
#
# nightlies stay on the rolling `nightly` tag and never reach the latest channel.
on:
  push:
    tags:
      - "Beta*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist, e.g. Beta0.2)"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'lanche-furry/IRIXEN-Code'
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # `tauri build` runs beforeBuildCommand (`npm run build`) itself, so the
      # type check is covered here too.
      - name: Build NSIS installer
        run: npm run tauri build

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          src=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          test -n "$src" || { echo "no installer produced"; exit 1; }
          mkdir -p out
          cp "$src" "out/IRIXEN.Code_${version}_x64-setup.exe"
          ls -l out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/*

  linux:
    if: github.repository == 'lanche-furry/IRIXEN-Code'
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Cheap insurance: the tag must point at code that already passes.
      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # tauri.conf.json pins `bundle.targets` to nsis, so ask for the Linux
      # formats explicitly.
      - name: Build deb and AppImage
        run: npx tauri build --bundles deb,appimage

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          appimage=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          deb=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -n1)
          mkdir -p out
          test -n "$appimage" && cp "$appimage" "out/IRIXEN_Code_${version}_amd64.AppImage"
          test -n "$deb" && cp "$deb" "out/IRIXEN_Code_${version}_amd64.deb"
          test -n "$appimage" -a -n "$deb" || { echo "missing Linux bundle"; exit 1; }
          ls -l out

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: out/*

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A tag cut without running `npm run bump` produces an installer whose
      # version contradicts its own release. Tags are product labels (`Beta0.2`),
      # so compare the numeric parts: one must be a prefix of the other.
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stripped=$(echo "$tag" | sed 's/^[vV]//')
          core=$(node -p "require('./package.json').version.split('-')[0]")
          digits=$(echo "$stripped" | grep -oE '[0-9]+' | paste -sd. -)
          case "$core" in
            "$digits"|"$digits".*) echo "tag $tag -> version $core";;
            *)
              case "$digits" in
                "$core"|"$core".*) echo "tag $tag -> version $core";;
                *) echo "::error::tag $tag does not match package version $core — run npm run bump first"; exit 1;;
              esac;;
          esac

      - name: Publish latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The human-facing label, kept in sync by `npm run bump --label`.
          title=$(sed -n 's/.*pub const DISPLAY_VERSION: &str = "\([^"]*\)".*/\1/p' src-tauri/src/update.rs)
          test -n "$title" || title="$tag"
          if [ -f "docs/release-notes/${tag}.md" ]; then
            notes=(--notes-file "docs/release-notes/${tag}.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$tag" dist/* \
            --title "$title" \
            --latest \
            "${notes[@]}"
          gh release view "$tag" --json tagName,isLatest,isPrerelease,assets \
            --jq '{tag: .tagName, latest: .isLatest, pre: .isPrerelease, assets: [.assets[].name]}'
